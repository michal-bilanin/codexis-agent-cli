[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codexis-docs"
version = "0.1.0"
description = "Crawl and search the CODEXIS AI documentation from the command line."
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "selectolax",
    "apsw",
    "simplemma",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
codexis-docs = "codexis_docs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
